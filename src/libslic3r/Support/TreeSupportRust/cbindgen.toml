[export]
include_guard = "ORCA_TREE_SUPPORTS_H"
language = "C"
header = "/* Generated by cbindgen — do not edit manually. */"
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true
style = "Both"
cpp_compat = true

[export.rename]
"TreeSupportConfig" = "OrcaTreeSupportConfig"
"MeshData" = "OrcaMeshData"
"SupportOutput" = "OrcaSupportOutput"
"SupportLayerOutput" = "OrcaSupportLayerOutput"
"TreeSupportHandle" = "OrcaTreeSupportHandle"

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
prefix = "ORCA_EXPORT"

[defines]
"target_os = windows" = "ORCA_WINDOWS"
