[package]
name = "orca-tree-supports"
version = "0.1.0"
edition = "2021"
authors = ["OrcaSlicer Contributors"]
description = "Tree/organic support generation for OrcaSlicer, a Rust reimplementation of the C++ TreeSupport subsystem."
license = "AGPL-3.0-or-later"
repository = "https://github.com/SoftFever/OrcaSlicer"
readme = "README.md"

[lib]
name = "orca_tree_supports"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
nalgebra = "0.32"
rayon = "1.10"
parry3d = "0.17"
thiserror = "1.0"
smallvec = "1.13"

[dev-dependencies]
approx = "0.5"

[build-dependencies]
cbindgen = "0.27"

[features]
default = []
serde = ["dep:serde"]

[dependencies.serde]
version = "1.0"
optional = true
features = ["derive"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
